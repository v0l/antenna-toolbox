[package]
name = "antenna-toolbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[package.metadata.deb]
name = "antenna-toolbox"
maintainer = "v0l <kieran@harkin.me>"
copyright = "v0l"
license-file = ["../../LICENSE", "0"]
section = "hamradio"
priority = "optional"
extended-description = """\
Wire antenna modelling by the method of moments, FDTD for printed antennas, \
NanoVNA control with calibration, and point to point, coverage and HF \
skywave path planning."""
assets = [
    ["target/release/antenna-toolbox", "usr/bin/", "755"],
    ["../../packaging/linux/antenna-toolbox.desktop", "usr/share/applications/", "644"],
    ["../../README.md", "usr/share/doc/antenna-toolbox/README.md", "644"],
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
antenna-solver.workspace = true
antenna-designs.workspace = true
antenna-vna.workspace = true
antenna-terrain.workspace = true
antenna-rf.workspace = true
antenna-hf.workspace = true
rayon.workspace = true
egui.workspace = true
eframe.workspace = true
egui_bench.workspace = true
dirs.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
wasm-bindgen-rayon.workspace = true
parking_lot_core = { version = "0.9", features = ["nightly"] }
js-sys.workspace = true
web-sys.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["wgpu", "eframe"] }
