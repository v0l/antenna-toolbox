[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/v0l/antenna-toolbox"
description = "Antenna modelling, NanoVNA control and radio path planning"

[workspace.dependencies]
antenna-solver = { package = "sims-antenna", git = "https://github.com/v0l/sims", rev = "ff342bc2bc39eb56172d2c5dc5fc06f5b24e24ac" }
antenna-designs = { path = "crates/designs" }
antenna-vna = { path = "crates/vna" }
antenna-terrain = { package = "sims-propagation", git = "https://github.com/v0l/sims", rev = "ff342bc2bc39eb56172d2c5dc5fc06f5b24e24ac" }
antenna-rf = { path = "crates/rf" }
antenna-hf = { package = "sims-hf", git = "https://github.com/v0l/sims", rev = "ff342bc2bc39eb56172d2c5dc5fc06f5b24e24ac" }
num-complex = "0.4"
rayon = "1.11"
serialport = "4.10"
ureq = "3"
dirs = "6"
egui = "0.35"
web-time = "1"
ehttp = "0.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-rayon = "1.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Storage", "console", "Navigator", "Serial", "SerialPort", "SerialOptions", "ReadableStream", "ReadableStreamDefaultReader", "WritableStream", "WritableStreamDefaultWriter", "SerialPortRequestOptions"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui_bench = { version = "0.5.4", features = ["viewer3d"] }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
