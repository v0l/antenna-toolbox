[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/v0l/antenna-toolbox"
description = "Antenna modelling, NanoVNA control and radio path planning"

[workspace.dependencies]
antenna-solver = { path = "crates/solver" }
antenna-designs = { path = "crates/designs" }
antenna-vna = { path = "crates/vna" }
antenna-terrain = { path = "crates/terrain" }
antenna-rf = { path = "crates/rf" }
antenna-hf = { path = "crates/hf" }
sims-field = { git = "https://github.com/v0l/sims", rev = "55e5363796275454b35308334fae5b89e3e89aa4" }
num-complex = "0.4"
rayon = "1.11"
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
serialport = "4.10"
tiff = "0.11"
memmap2 = "0.9"
ureq = "3"
dirs = "6"
egui = "0.35"
web-time = "1"
ehttp = "0.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-rayon = "1.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Storage", "console", "Navigator", "Serial", "SerialPort", "SerialOptions", "ReadableStream", "ReadableStreamDefaultReader", "WritableStream", "WritableStreamDefaultWriter", "SerialPortRequestOptions"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui_bench = { version = "0.3.0", features = ["viewer3d"] }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
